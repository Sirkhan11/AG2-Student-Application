# Refreshes the public list of NSU societies (src/lib/societies/nsu-societies.json) and, if it
# changed, opens or updates a pull request with it, so a person checks it before it reaches the app.
#
# - It only collects. It never imports anything into Firestore, holds no secrets and needs no service
#   account: the society pages import stays a manual step with a short-lived key (see the README).
#   If the import is ever automated, use Workload Identity Federation limited to main, not a stored key.
# - It only reads the list (--no-pages): NSU's A to Z page and the society list from the API NSU's
#   own page uses, 2 or 3 requests. It never reads the society pages, so no personal data passes
#   through it, and only the list file is ever committed. Nothing is uploaded as an artifact.
# - NSU agreed to the app showing their society information, but their robots.txt asks bots not to
#   crawl mynsu.co.uk. So it only runs when started by hand, and the weekly schedule below stays
#   commented out until NSU agree to it in writing.
# - Opening the pull request needs "Allow GitHub Actions to create and approve pull requests"
#   (Settings > Actions > General), which a repo admin turns on.

name: Refresh NSU societies list

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * 1' # Mondays at 06:00 UTC. Only once NSU agree in writing.

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-nsu-societies
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Collect the list (2 or 3 requests; no society pages)
        run: node scripts/collect-nsu-societies.mjs --no-pages --summary "$RUNNER_TEMP/nsu-summary.md"

      - name: Check the list
        run: node scripts/check-societies.mjs

      - name: Open or update the pull request if the list changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- src/lib/societies/nsu-societies.json; then
            echo "The list hasn't changed, so there's nothing to open."
            exit 0
          fi
          branch=nsu-societies-refresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -- src/lib/societies/nsu-societies.json
          git commit -m "Refresh the NSU societies list"
          git push --force origin "$branch"
          if [ "$(gh pr view "$branch" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/nsu-summary.md"
          else
            gh pr create --head "$branch" --base "$BASE" --title "Refresh the NSU societies list" --body-file "$RUNNER_TEMP/nsu-summary.md"
          fi
